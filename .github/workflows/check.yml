name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Offline self-check
        run: python scripts/demo.py
      - name: Tone check (zh)
        run: python scripts/tone_check.py --file examples/voice-apple.txt
      - name: Tone check (en)
        run: python scripts/tone_check.py --file examples/voice-apple-en.txt --lang en
      - name: Quote verification
        run: |
          python scripts/quote.py "price is what you pay, value is what you get" --verify
          ! python scripts/quote.py "this sentence was never said by warren buffett" --verify
      - name: Tests
        run: pytest -q
